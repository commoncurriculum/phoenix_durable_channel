name: Test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7.0
        ports: ["4403:27017"]
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "25.3.2.21"
          elixir-version: "1.17.3-otp-25"
          version-type: strict

      - uses: actions/cache@v4
        with:
          path: |
            integration_test/phoenix_app/deps
            integration_test/phoenix_app/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('integration_test/phoenix_app/mix.lock') }}

      - name: Phoenix's own server tests
        run: mix deps.get && mix test

      - name: Install the s2 CLI
        run: |
          curl -fsSL -o /tmp/s2.zip https://github.com/s2-streamstore/s2/releases/download/s2-cli-v0.43.2/s2-x86_64-unknown-linux-gnu.zip
          sudo unzip -o /tmp/s2.zip -d /usr/local/bin
          sudo chmod +x /usr/local/bin/s2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium for vitest browser mode
        run: pnpm exec playwright install chromium --with-deps

      - name: Typecheck
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Phoenix's own JS tests
        run: npx jest -c phoenix_js_test/jest.config.cjs -i

      - name: The Durable Streams worker's log
        if: failure()
        run: tail -n 300 integration_test/durable_streams/wrangler.log

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Model-check with TLA+
        run: verification/check.sh

  every-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "25.3.2.21"
          elixir-version: "1.17.3-otp-25"
          version-type: strict

      - name: Every commit type checks and has no comments
        env:
          FIRST: ${{ github.event.pull_request.base.sha || github.event.before }}
          LAST: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$FIRST" ] || ! git cat-file -e "$FIRST^{commit}" 2>/dev/null; then
            FIRST="$(git merge-base origin/main "$LAST")"
            if [ "$FIRST" = "$(git rev-parse "$LAST")" ]; then FIRST="$LAST~1"; fi
          fi
          commits="$(git rev-list --reverse "$FIRST..$LAST")"
          if [ -z "$commits" ]; then echo "no commits between $FIRST and $LAST"; exit 1; fi
          for commit in $commits; do
            git checkout -q "$commit"
            pnpm lint || { echo "$commit does not type check"; exit 1; }
            elixir -e "ExUnit.start()" -r test/no_comments_test.exs || { echo "$commit has a comment"; exit 1; }
          done
